<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldman - Dynamic Forms</title>
    <link rel="stylesheet" href="css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>🏦 Fieldman Forms</h1>
            <div id="auth-status">
                <span id="user-display">Not logged in</span>
                <button id="logout-btn" style="display: none;">Logout</button>
            </div>
        </div>
    </header>

    <nav class="container">
        <button class="tab-btn active" data-tab="select-form">Select Form</button>
        <button class="tab-btn" data-tab="fill-form">Fill Form</button>
        <button class="tab-btn" data-tab="submissions">My Submissions</button>
    </nav>

    <main class="container">
        <!-- Tab 1: Select Form -->
        <section id="select-form" class="tab-content active">
            <div class="card">
                <h2>Select a Form</h2>
                
                <div class="form-group">
                    <label for="bank-select">Select Bank</label>
                    <select id="bank-select" class="form-control">
                        <option value="">-- Select a Bank --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="template-select">Select Form Type</label>
                    <select id="template-select" class="form-control" disabled>
                        <option value="">-- First select a bank --</option>
                    </select>
                </div>

                <button id="start-form-btn" class="btn btn-primary" disabled>Start Form</button>
                
                <div id="template-info" class="info-box" style="display: none;">
                    <h3>Form Information</h3>
                    <p id="template-title"></p>
                    <p id="template-description"></p>
                    <p id="template-version"></p>
                </div>
            </div>

            <div class="card">
                <h3>Quick Test: Demo Form</h3>
                <p>Try a sample form without selecting a bank</p>
                <button id="demo-form-btn" class="btn btn-secondary">Load Demo Form</button>
            </div>
        </section>

        <!-- Tab 2: Fill Form -->
        <section id="fill-form" class="tab-content">
            <div class="card">
                <div id="form-header">
                    <h2 id="current-form-title">No Form Selected</h2>
                    <p id="current-form-description"></p>
                </div>

                <div id="form-container">
                    <div class="empty-state">
                        <p>👈 Select a form from the "Select Form" tab to get started</p>
                    </div>
                </div>

                <div id="form-actions" style="display: none;">
                    <button id="validate-btn" class="btn btn-secondary">Validate</button>
                    <button id="save-draft-btn" class="btn btn-outline">Save Draft</button>
                    <button id="submit-btn" class="btn btn-primary">Submit</button>
                </div>

                <div id="validation-errors" class="error-container" style="display: none;"></div>
            </div>
        </section>

        <!-- Tab 3: Submissions -->
        <section id="submissions" class="tab-content">
            <div class="card">
                <h2>My Submissions</h2>
                <button id="refresh-submissions-btn" class="btn btn-secondary">Refresh</button>
                <div id="submissions-list" class="submissions-grid">
                    <div class="empty-state">
                        <p>No submissions yet</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="js/app.js"></script>
    <script src="js/form-renderer.js"></script>
</body>
</html>
